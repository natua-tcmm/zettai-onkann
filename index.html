<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pitch Test</title>
    <link rel="stylesheet" href="styles.css?v=20260616-3">
  </head>
  <body>
    <main class="app-shell">
      <section id="quizView" class="quiz-view" aria-labelledby="noteName">
        <div class="top-bar">
          <div>
            <p class="kicker">Pitch Test</p>
            <h1 id="noteName">A3</h1>
          </div>
          <div class="progress-block" aria-live="polite">
            <span id="progressText">1 / 15</span>
            <div class="progress-track" aria-hidden="true">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
        </div>

        <div class="control-panel">
          <button id="toggleSound" class="primary-button" type="button">再生</button>

          <label class="slider-wrap">
            <span>周波数を調整</span>
            <input id="frequencySlider" type="range" min="0" max="1000" value="500" step="1">
          </label>

          <button id="answerButton" class="secondary-button" type="button">この音で回答</button>
          <p id="audioStatus" class="audio-status" aria-live="polite"></p>
        </div>
      </section>

      <section id="resultView" class="result-view" aria-labelledby="resultTitle" hidden>
        <div class="result-heading">
          <div>
            <p class="kicker">Result</p>
            <h1 id="resultTitle">結果</h1>
          </div>
          <button id="restartButton" class="secondary-button" type="button">もう一度</button>
        </div>

        <div class="summary-grid">
          <div class="summary-item">
            <span>平均ズレ</span>
            <strong id="averageCents">0 cents</strong>
          </div>
          <div class="summary-item">
            <span>最大ズレ</span>
            <strong id="maxCents">0 cents</strong>
          </div>
        </div>

        <div class="plot-section">
          <h2>音感のズレ</h2>
          <canvas id="resultPlot" width="980" height="420"></canvas>
        </div>

        <div class="table-section">
          <h2>回答一覧</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>音名</th>
                  <th>正解周波数</th>
                  <th>回答周波数</th>
                  <th>ズレ</th>
                </tr>
              </thead>
              <tbody id="resultTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260616-3"></script>
  </body>
</html>
